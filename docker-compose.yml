# aplogs — central de logs e monitoramento (API + painel na porta 3070, MySQL local)
#   cp .env.example .env    (troque as senhas)
#   docker compose up -d --build
#   docker compose logs -f aplogs-api
services:
  aplogs-db:
    image: mysql:8.4
    container_name: aplogs-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-aplogs}
      MYSQL_USER: ${DB_USER:-aplogs}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - aplogs-mysql:/var/lib/mysql
    # Só nesta máquina (DBeaver/Workbench em 127.0.0.1:3307). Tire esta seção para não expor nada.
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  aplogs-api:
    build: ./api
    container_name: aplogs-api
    restart: unless-stopped
    init: true
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # apusers (login central) na mesma máquina: http://host.docker.internal:3080
    environment:
      DB_HOST: aplogs-db
      DB_PORT: 3306
    ports:
      - "${APLOGS_PORT:-3070}:8000"     # acessível pela rede: http://<ip-da-máquina>:3070
    depends_on:
      aplogs-db:
        condition: service_healthy
    networks:
      - default
      - aplogs          # outros composes na mesma máquina entram nesta rede e chamam http://aplogs-api:8000

volumes:
  aplogs-mysql:
    # Nome fixo: os dados sobrevivem a "docker compose down" e "up --build".
    # Só "docker compose down -v" apaga o banco.
    name: aplogs_mysql-data

networks:
  aplogs:
    # Nome fixo para os outros serviços usarem. No docker-compose.yml deles:
    #   services:
    #     meu-servico:
    #       networks: [default, aplogs]
    #   networks:
    #     aplogs:
    #       external: true
    # e APLOGS_URL=http://aplogs-api:8000  (o banco NÃO fica nesta rede, só a API)
    name: aplogs
